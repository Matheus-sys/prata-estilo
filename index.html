<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prata &amp; Estilo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Parisienne&family=Roboto+Mono:wght@500;700&display=swap">
<style>
  :root {
    --marca:      #4FE0E0;
    --marca-esc:  #0B6B74;
    --chao:       #F2F5F6;
    --superf:     #FFFFFF;
    --superf-2:   #E9EEEF;
    --tinta:      #3A3A3A;
    --tinta-2:    #5F6B6E;
    --borda:      #D5DEE0;
    --borda-fort: #7A8C90;
    --tem-txt:    #1B5E20;  --tem-fnd:    #E6F4EA;
    --ult-txt:    #8A4B00;  --ult-fnd:    #FFF0D9;
    --aca-txt:    #9B1C1C;  --aca-fnd:    #FBE3E3;
    --sombra:     0 1px 2px rgba(18,40,44,.06), 0 4px 12px rgba(18,40,44,.05);
    --r:          10px;
    --serif:      "Parisienne", "Segoe Script", cursive;
    --sans:       "DM Sans", "Segoe UI", system-ui, sans-serif;
    --mono:       "Roboto Mono", Consolas, ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --chao: #141A1B; --superf: #1D2527; --superf-2: #263033;
      --tinta: #E6ECED; --tinta-2: #9DACAF;
      --borda: #2F3B3E; --borda-fort: #5E7276;
      --marca-esc: #55D3DC;
      --tem-txt: #7FD68C; --tem-fnd: #16301B;
      --ult-txt: #F0B963; --ult-fnd: #35260E;
      --aca-txt: #F09090; --aca-fnd: #3A1A1A;
      --sombra: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --chao: #141A1B; --superf: #1D2527; --superf-2: #263033;
    --tinta: #E6ECED; --tinta-2: #9DACAF;
    --borda: #2F3B3E; --borda-fort: #5E7276;
    --marca-esc: #55D3DC;
    --tem-txt: #7FD68C; --tem-fnd: #16301B;
    --ult-txt: #F0B963; --ult-fnd: #35260E;
    --aca-txt: #F09090; --aca-fnd: #3A1A1A;
    --sombra: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--chao); color: var(--tinta);
    font-family: var(--sans); font-size: 15px; line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  :focus-visible { outline: 3px solid var(--marca-esc); outline-offset: 2px; border-radius: 4px; }

  /* ---------- faixa da marca ---------- */
  .marca {
    background: var(--marca); color: #3A3A3A;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .marca h1 {
    font-family: var(--serif); font-weight: 400; font-size: 30px;
    margin: 0; line-height: 1.05; letter-spacing: .3px;
  }
  .marca .sub {
    font-size: 11px; font-weight: 700; letter-spacing: .13em;
    text-transform: uppercase; opacity: .72; margin-left: auto; white-space: nowrap;
  }

  /* ---------- barra de busca (fica grudada no topo) ---------- */
  .barra {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--chao); border-bottom: 1px solid var(--borda);
    padding: 10px 16px 8px; display: flex; flex-direction: column; gap: 8px;
  }
  .campo { position: relative; display: flex; }
  .campo svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--tinta-2); }
  #busca {
    flex: 1; font: inherit; font-size: 16px; color: var(--tinta);
    background: var(--superf); border: 2px solid var(--borda-fort); border-radius: var(--r);
    padding: 11px 40px 11px 38px; min-width: 0;
  }
  #busca::placeholder { color: var(--tinta-2); }
  #limpar {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; color: var(--tinta-2); cursor: pointer;
    font-size: 20px; line-height: 1; padding: 6px 8px; border-radius: 6px;
  }
  .filtros { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .filtros::-webkit-scrollbar { display: none; }
  .cat {
    flex: 0 0 auto; font: inherit; font-size: 13px; font-weight: 500;
    background: var(--superf); color: var(--tinta-2);
    border: 1px solid var(--borda); border-radius: 999px;
    padding: 7px 14px; cursor: pointer; white-space: nowrap; min-height: 34px;
  }
  .cat[aria-pressed="true"] { background: var(--marca-esc); border-color: var(--marca-esc); color: #fff; font-weight: 700; }
  :root[data-theme="dark"] .cat[aria-pressed="true"],
  :root:not([data-theme="light"]) .cat[aria-pressed="true"] { color: #0B1618; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .cat[aria-pressed="true"] { color: #fff; } }

  .linha-estado {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--tinta-2);
  }
  .carimbo {
    font-weight: 700; font-size: 11.5px; letter-spacing: .04em;
    padding: 3px 9px; border-radius: 999px;
    background: var(--superf-2); color: var(--tinta-2); white-space: nowrap;
  }
  .carimbo.velho { background: var(--ult-fnd); color: var(--ult-txt); }
  .aviso-demo {
    background: var(--ult-fnd); color: var(--ult-txt);
    font-size: 12.5px; font-weight: 500; padding: 9px 16px;
    border-bottom: 1px solid var(--borda);
  }
  .aviso-demo b { font-weight: 700; }

  /* ---------- grade de peças ---------- */
  .grade {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px; padding: 12px 16px calc(28px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 560px)  { .grade { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; } }
  @media (min-width: 820px)  { .grade { grid-template-columns: repeat(4, minmax(0,1fr)); } }
  @media (min-width: 1120px) { .grade { grid-template-columns: repeat(5, minmax(0,1fr)); max-width: 1320px; margin: 0 auto; } }

  .peca {
    display: flex; flex-direction: column; text-align: left;
    background: var(--superf); border: 1px solid var(--borda);
    border-radius: var(--r); box-shadow: var(--sombra);
    overflow: hidden; cursor: pointer; font: inherit; color: inherit;
    padding: 0; transition: transform .12s ease, box-shadow .12s ease;
  }
  .peca:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(18,40,44,.12); }
  @media (prefers-reduced-motion: reduce) { .peca { transition: none; } .peca:hover { transform: none; } }
  .peca.zerada .moldura { opacity: .42; }
  .peca.zerada .cod { color: var(--tinta-2); }

  .moldura {
    aspect-ratio: 1 / 1; width: 100%; background: var(--superf-2);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .moldura img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .moldura svg { width: 54%; height: 54%; color: var(--borda-fort); }
  .sem-foto { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--tinta-2); }
  .sem-foto span { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }

  .corpo { padding: 9px 10px 11px; display: flex; flex-direction: column; gap: 5px; }
  .chip {
    align-self: flex-start; font-size: 11.5px; font-weight: 700; letter-spacing: .02em;
    padding: 3px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .chip.tem    { background: var(--tem-fnd); color: var(--tem-txt); }
  .chip.ultimas{ background: var(--ult-fnd); color: var(--ult-txt); }
  .chip.acabou { background: var(--aca-fnd); color: var(--aca-txt); }
  .cod { font-family: var(--mono); font-weight: 700; font-size: 13px; letter-spacing: -.01em; }
  /* Duas linhas sempre: cartões de altura igual, que é o que torna a grade varrível de relance. */
  .nome {
    font-size: 13px; color: var(--tinta-2); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: calc(2 * 1.3em);
  }
  .preco { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

  .vazio { padding: 48px 24px; text-align: center; color: var(--tinta-2); }
  .vazio strong { display: block; color: var(--tinta); font-size: 17px; margin-bottom: 6px; }

  /* ---------- ficha da peça ---------- */
  dialog.ficha {
    border: 0; padding: 0; background: transparent; max-width: none; max-height: none;
    width: 100%; height: 100%; margin: 0;
  }
  dialog.ficha::backdrop { background: rgba(12, 26, 28, .55); }
  .ficha-caixa {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--superf); color: var(--tinta);
    border-radius: 16px 16px 0 0; box-shadow: 0 -8px 40px rgba(0,0,0,.28);
    max-height: 92%; overflow-y: auto;
    padding: 0 18px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 620px) {
    .ficha-caixa { position: relative; margin: 6vh auto; max-width: 440px; border-radius: 14px; max-height: 88vh; }
  }
  .puxador { width: 40px; height: 4px; border-radius: 99px; background: var(--borda); margin: 10px auto 4px; }
  .ficha-foto { aspect-ratio: 1/1; border-radius: var(--r); overflow: hidden; background: var(--superf-2);
                display: flex; align-items: center; justify-content: center; margin: 8px 0 14px; }
  .ficha-foto img { width: 100%; height: 100%; object-fit: cover; }
  .ficha-foto svg { width: 46%; height: 46%; color: var(--borda-fort); }
  .ficha-cod { font-family: var(--mono); font-weight: 700; font-size: 22px; }
  .ficha-nome { font-size: 17px; font-weight: 500; margin: 2px 0 10px; }
  .ficha-preco { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 12px 0 4px; }
  .atributos { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 1px;
               background: var(--borda); border: 1px solid var(--borda); border-radius: var(--r); overflow: hidden; }
  .atributos li { display: flex; justify-content: space-between; gap: 14px; background: var(--superf); padding: 9px 12px; font-size: 14px; }
  .atributos dt, .atributos .rot { color: var(--tinta-2); font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .atributos .val { text-align: right; font-variant-numeric: tabular-nums; }
  .acoes { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    flex: 1; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    padding: 13px 14px; border-radius: var(--r); min-height: 48px;
    border: 1px solid var(--borda-fort); background: var(--superf); color: var(--tinta);
  }
  .btn.primario { background: var(--marca-esc); border-color: var(--marca-esc); color: #fff; }
  :root[data-theme="dark"] .btn.primario,
  :root:not([data-theme="light"]) .btn.primario { color: #08191B; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn.primario { color: #fff; } }
  .btn.primario.feito { background: var(--tem-fnd); border-color: var(--tem-txt); color: var(--tem-txt); }
</style>

<header class="marca">
  <h1>Prata &amp; Estilo</h1>
  <span class="sub">Catálogo</span>
</header>

<div class="aviso-demo" id="avisoDemo" hidden>
  <b>Dados de exemplo.</b> A planilha ainda não foi conectada — as 8 peças abaixo são fictícias e
  servem para conferir o layout.
</div>

<div class="barra">
  <div class="campo">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
    </svg>
    <input id="busca" type="search" placeholder="Buscar peça, código ou coleção" autocomplete="off" enterkeyhint="search" aria-label="Buscar peça">
    <button id="limpar" type="button" aria-label="Limpar busca" hidden>&times;</button>
  </div>
  <div class="filtros" id="filtros" role="group" aria-label="Filtrar por categoria"></div>
  <div class="linha-estado">
    <span class="carimbo" id="carimbo">Carregando…</span>
    <span id="contagem"></span>
  </div>
</div>

<main class="grade" id="grade" aria-live="polite"></main>

<dialog class="ficha" id="ficha" aria-label="Detalhe da peça">
  <div class="ficha-caixa" id="fichaCaixa"></div>
</dialog>

<script>
(function () {
  "use strict";

  // ─────────────────────────────────────────────────────────────
  // CONFIGURAÇÃO — trocar estes dois valores ao publicar de verdade
  // ─────────────────────────────────────────────────────────────
  // URL do "Publicar na web > CSV" da aba ESTOQUE.
  // Verificado: responde text/csv e manda Access-Control-Allow-Origin: *
  var CSV_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXfRnuTXZ7whr4Jw5DVmnSE0I6ho3gvjPtxLDFlPs3PLetfmbSPXqoSfAcf_loLzYmuSghxQCbL3wE/pub?gid=1717554805&single=true&output=csv";
  var URL_FOTO = "fotos/";  // pasta das fotos, no mesmo site
  var RECARGA_MS = 60000;   // relê a planilha a cada 60 s
  var VELHO_MS   = 600000;  // 10 min sem conseguir reler = carimbo de DESATUALIZADO

  var LIMITE_ULTIMAS = 3;

  // ─────────── silhuetas por categoria (enquanto não há foto) ───────────
  var SILHUETAS = {
    anel:     '<circle cx="50" cy="60" r="26"/><path d="M42 34h16l-4 8H46z"/><path d="M50 22l7 12H43z"/>',
    brinco:   '<circle cx="50" cy="26" r="8"/><path d="M50 34c-13 8-16 26-4 34 9 6 22 1 24-10"/>',
    colar:    '<path d="M18 22c0 28 14 44 32 44s32-16 32-44"/><circle cx="50" cy="76" r="9"/>',
    pulseira: '<ellipse cx="50" cy="50" rx="32" ry="21"/><ellipse cx="50" cy="50" rx="21" ry="12"/>',
    pingente: '<path d="M50 84S22 64 22 44a15 15 0 0 1 28-8 15 15 0 0 1 28 8c0 20-28 40-28 40z"/>',
    padrao:   '<path d="M32 22h36l14 20-32 38-32-38z"/><path d="M18 42h64M32 22l10 20-10 38M68 22 58 42l10 38M42 42h16"/>'
  };
  function silhueta(cat) {
    var k = (cat || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    var d = SILHUETAS[k] || SILHUETAS.padrao;
    return '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.2" ' +
           'stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">' + d + '</svg>';
  }

  // ─────────── utilidades ───────────
  // Reduz a palavra ao radical, para que "coracao" ache "corações" e "anel" ache "anéis".
  // Busca por pedaço de texto não casa singular com plural sozinha — e não achar a peça
  // é pior do que achar demais.
  function raiz(p) {
    if (p.length < 4) return p;
    if (/(OES|AES)$/.test(p)) return p.slice(0, -3) + "AO";   // CORACOES -> CORACAO
    if (/EIS$/.test(p))       return p.slice(0, -3) + "EL";   // ANEIS    -> ANEL
    if (/S$/.test(p))         return p.slice(0, -1);          // BRINCOS  -> BRINCO
    return p;
  }

  function normalizar(s) {
    return (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "")
      .toUpperCase().split(/[^0-9A-Z]+/).filter(Boolean).map(raiz).join(" ");
  }
  function esc(s) {
    return (s == null ? "" : String(s)).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function dinheiro(v) {
    var n = parseFloat(String(v).replace(/[^\d,.-]/g, "").replace(/\.(?=\d{3}\b)/g, "").replace(",", "."));
    if (!isFinite(n)) return "—";
    return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }
  // A loja preenche so o que quer que apareca. Preco em branco some da tela
  // em vez de virar um traco — traco parece defeito, ausencia parece escolha.
  function temPreco(p) {
    var n = parseFloat(String(p.preco).replace(/[^\d,.-]/g, "").replace(",", "."));
    return isFinite(n) && n > 0;
  }

  function hhmm(d) {
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  // Analisador de CSV que respeita campo entre aspas e quebra de linha dentro do campo
  function lerCSV(txt) {
    var linhas = [], campo = "", linha = [], dentro = false;
    for (var i = 0; i < txt.length; i++) {
      var c = txt[i];
      if (dentro) {
        if (c === '"') { if (txt[i + 1] === '"') { campo += '"'; i++; } else dentro = false; }
        else campo += c;
      } else if (c === '"') dentro = true;
      else if (c === ",") { linha.push(campo); campo = ""; }
      else if (c === "\n") { linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
      else if (c !== "\r") campo += c;
    }
    if (campo !== "" || linha.length) { linha.push(campo); linhas.push(linha); }
    return linhas;
  }

  // ─────────── estado ───────────
  var pecas = [], categoria = "(todas)", termo = "", ultimaLeitura = null, ehDemo = false;

  var elGrade = document.getElementById("grade");
  var elBusca = document.getElementById("busca");
  var elLimpar = document.getElementById("limpar");
  var elFiltros = document.getElementById("filtros");
  var elCarimbo = document.getElementById("carimbo");
  var elContagem = document.getElementById("contagem");
  var elAviso = document.getElementById("avisoDemo");
  var dlg = document.getElementById("ficha");
  var dlgCaixa = document.getElementById("fichaCaixa");

  // ─────────── dados de exemplo (só enquanto a planilha não está ligada) ───────────
  var DEMO = [
    { cod:"AN-0142", nome:"Anel coração vazado",        cat:"Anel",     teor:"Ouro 18k",                           peso:"3,40", tam:"16",    colecao:"Minimal 2026", forn:"Ourivesaria Lima", preco:"129,00", qtd:12 },
    { cod:"AN-0209", nome:"Anel liso largo",            cat:"Anel",     teor:"Ouro",                               peso:"5,10", tam:"18",    colecao:"Essencial",    forn:"Ourivesaria Lima", preco:"119,00", qtd:0  },
    { cod:"BR-0087", nome:"Brinco coração pequeno",     cat:"Brinco",   teor:"Ouro 10k",                           peso:"1,80", tam:"—",     colecao:"Minimal 2026", forn:"Prata Viva",       preco:"89,00",  qtd:2  },
    { cod:"BR-0301", nome:"Brinco argola texturizada",  cat:"Brinco",   teor:"Ouro 18k",                           peso:"2,60", tam:"25 mm", colecao:"Solar",        forn:"Prata Viva",       preco:"149,00", qtd:1  },
    { cod:"CO-0055", nome:"Colar veneziana fina",       cat:"Colar",    teor:"Ouro 18k",                           peso:"4,20", tam:"45 cm", colecao:"Essencial",    forn:"Ourivesaria Lima", preco:"179,00", qtd:7  },
    { cod:"PI-0311", nome:"Pingente coração zircônia",  cat:"Pingente", teor:"Ouro 10k",                           peso:"2,10", tam:"—",     colecao:"Minimal 2026", forn:"Prata Viva",       preco:"149,00", qtd:4  },
    { cod:"PU-0198", nome:"Pulseira elos corações",     cat:"Pulseira", teor:"Ouro",                               peso:"6,80", tam:"19 cm", colecao:"Minimal 2026", forn:"Casa Prata",       preco:"229,00", qtd:9  },
    { cod:"PU-0244", nome:"Pulseira berloque lisa",     cat:"Pulseira", teor:"Ouro 18k",                           peso:"7,40", tam:"18 cm", colecao:"Solar",        forn:"Casa Prata",       preco:"259,00", qtd:2  }
  ];

  function montarDemo() {
    ehDemo = true;
    elAviso.hidden = false;
    pecas = DEMO.map(function (d) {
      return {
        cod: d.cod, nome: d.nome, cat: d.cat, teor: d.teor, peso: d.peso,
        tam: d.tam, colecao: d.colecao, forn: d.forn, preco: d.preco,
        qtd: d.qtd, temFoto: false,
        busca: normalizar([d.cod, d.nome, d.cat, d.teor, d.colecao, d.forn, d.tam].join(" "))
      };
    });
    ultimaLeitura = new Date();
  }

  // ─────────── achar as colunas pelo NOME do cabeçalho ───────────
  //
  // Antes isto lia por posição fixa (F = peso, G = tamanho). No dia em que
  // alguém trocou duas colunas de lugar na planilha, a vitrine passou a
  // mostrar o peso no lugar do tamanho — sem erro nenhum, só errado.
  //
  // Lendo pelo nome do cabeçalho, reordenar colunas deixa de quebrar. A
  // posição fica só como rede de segurança para quando o cabeçalho sumir
  // (já aconteceu: a célula de Qtd_Atual virou #REF! e perdeu o título).
  var COLUNAS = {
    cod:     { nomes: ["codigo"],                  pos: 1 },
    nome:    { nomes: ["nome"],                    pos: 2 },
    cat:     { nomes: ["categoria"],               pos: 3 },
    teor:    { nomes: ["teor", "material"],        pos: 4 },
    peso:    { nomes: ["peso g", "peso", "pesog"], pos: 6 },
    tam:     { nomes: ["tamanho aro", "tamanho", "aro"], pos: 5 },
    colecao: { nomes: ["colecao"],                 pos: 7 },
    forn:    { nomes: ["fornecedor"],              pos: 8 },
    preco:   { nomes: ["preco venda", "preco"],    pos: 9 },
    ativo:   { nomes: ["ativo"],                   pos: 11 },
    qtd:     { nomes: ["qtd atual", "qtd", "quantidade"], pos: 14 }
  };

  function mapearColunas(cabecalho) {
    var limpo = cabecalho.map(function (c) {
      return String(c || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
        .toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    });
    var mapa = {};
    for (var campo in COLUNAS) {
      if (!COLUNAS.hasOwnProperty(campo)) continue;
      var achou = -1;
      var nomes = COLUNAS[campo].nomes;
      for (var n = 0; n < nomes.length && achou < 0; n++) {
        achou = limpo.indexOf(nomes[n]);
      }
      mapa[campo] = achou >= 0 ? achou : COLUNAS[campo].pos;
    }
    return mapa;
  }

  // ─────────── carregar a planilha ───────────
  function carregar() {
    if (!CSV_URL) { if (!pecas.length) { montarDemo(); montarFiltros(); desenhar(); } return; }
    fetch(CSV_URL, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (txt) {
        var linhas = lerCSV(txt);
        if (linhas.length < 2) throw new Error("planilha vazia");
        var c = mapearColunas(linhas[0]);
        var novas = [];
        for (var i = 1; i < linhas.length; i++) {
          var L = linhas[i];
          function campo(k) { return String(L[c[k]] || "").trim(); }
          var cod = campo("cod");
          if (!cod) continue;
          if ((campo("ativo") || "SIM").toUpperCase() === "NÃO") continue;
          var qtd = parseInt(campo("qtd").replace(/[^\d-]/g, ""), 10);
          novas.push({
            cod: cod, nome: campo("nome"), cat: campo("cat"),
            teor: campo("teor"), peso: campo("peso"), tam: campo("tam"),
            colecao: campo("colecao"), forn: campo("forn"), preco: campo("preco"),
            qtd: isFinite(qtd) ? qtd : 0, temFoto: true,
            busca: normalizar([cod, campo("nome"), campo("cat"), campo("teor"),
                               campo("colecao"), campo("forn"), campo("tam")].join(" "))
          });
        }
        pecas = novas; ehDemo = false; elAviso.hidden = true;
        ultimaLeitura = new Date();
        montarFiltros(); desenhar();
      })
      .catch(function () {
        // Não apaga o que já está na tela: mantém o último cache e deixa o carimbo denunciar a idade.
        if (!pecas.length) { montarDemo(); montarFiltros(); }
        desenhar();
      });
  }

  // ─────────── filtros de categoria ───────────
  function montarFiltros() {
    var cats = ["(todas)"];
    pecas.forEach(function (p) { if (p.cat && cats.indexOf(p.cat) < 0) cats.push(p.cat); });
    elFiltros.innerHTML = cats.map(function (c) {
      return '<button class="cat" type="button" data-cat="' + esc(c) + '" aria-pressed="' +
             (c === categoria) + '">' + esc(c === "(todas)" ? "Tudo" : c) + "</button>";
    }).join("");
  }
  elFiltros.addEventListener("click", function (e) {
    var b = e.target.closest(".cat"); if (!b) return;
    categoria = b.dataset.cat;
    Array.prototype.forEach.call(elFiltros.children, function (x) {
      x.setAttribute("aria-pressed", String(x.dataset.cat === categoria));
    });
    desenhar();
  });

  // ─────────── busca ───────────
  elBusca.addEventListener("input", function () {
    termo = normalizar(elBusca.value);
    elLimpar.hidden = !elBusca.value;
    desenhar();
  });
  elLimpar.addEventListener("click", function () {
    elBusca.value = ""; termo = ""; elLimpar.hidden = true; desenhar(); elBusca.focus();
  });

  function filtradas() {
    return pecas.filter(function (p) {
      if (categoria !== "(todas)" && p.cat !== categoria) return false;
      if (termo && p.busca.indexOf(termo) < 0) return false;
      return true;
    }).sort(function (a, b) {
      var ra = a.qtd <= 0 ? 0 : 1, rb = b.qtd <= 0 ? 0 : 1;   // o que acabou vai para o fim
      if (ra !== rb) return rb - ra;
      return a.nome.localeCompare(b.nome, "pt-BR");
    });
  }

  function estado(q) {
    if (q <= 0)               return { cls: "acabou",  txt: "✖ ACABOU 0" };
    if (q < LIMITE_ULTIMAS)   return { cls: "ultimas", txt: "▲ ÚLTIMAS " + q };
    return                           { cls: "tem",     txt: "● TEM " + q };
  }

  var SEM_FOTO_HTML =
    '<div class="sem-foto"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M3 8h4l2-2h6l2 2h4v12H3z"/><circle cx="12" cy="13" r="3.4"/></svg>' +
    "<span>Sem foto</span></div>";

  function moldura(p, grande) {
    if (p.temFoto) {
      var url = URL_FOTO + encodeURIComponent(p.cod) + ".jpg";
      return '<img class="foto" src="' + esc(url) + '" alt="' + esc(p.nome) +
             '" loading="' + (grande ? "eager" : "lazy") + '">';
    }
    return silhueta(p.cat);
  }

  // Foto que não carrega vira o estado "sem foto" — nunca fica com a imagem da peça anterior.
  function ligarQuedaDeFoto(raiz) {
    Array.prototype.forEach.call(raiz.querySelectorAll("img.foto"), function (img) {
      img.addEventListener("error", function () {
        if (img.parentNode) img.parentNode.innerHTML = SEM_FOTO_HTML;
      });
      if (img.complete && img.naturalWidth === 0 && img.parentNode) {
        img.parentNode.innerHTML = SEM_FOTO_HTML;
      }
    });
  }

  // ─────────── desenhar a grade ───────────
  function desenhar() {
    var lista = filtradas();

    elContagem.textContent = lista.length === 0 ? "" :
      (lista.length === pecas.length ? lista.length + " peças" : lista.length + " de " + pecas.length + " peças");

    if (ultimaLeitura) {
      var velho = !ehDemo && (Date.now() - ultimaLeitura.getTime() > VELHO_MS);
      elCarimbo.textContent = velho
        ? "Estoque de " + hhmm(ultimaLeitura) + " — DESATUALIZADO"
        : "Estoque de " + hhmm(ultimaLeitura);
      elCarimbo.classList.toggle("velho", velho);
    }

    if (!lista.length) {
      elGrade.innerHTML = '<div class="vazio" style="grid-column:1/-1"><strong>Nenhuma peça encontrada</strong>' +
        (termo ? "Tente escrever menos: só <b>" + esc(elBusca.value.trim().split(/\s+/)[0]) + "</b>, por exemplo."
               : "Escolha outra categoria.") + "</div>";
      return;
    }

    elGrade.innerHTML = lista.map(function (p, i) {
      var e = estado(p.qtd);
      return '<button class="peca' + (p.qtd <= 0 ? " zerada" : "") + '" type="button" data-i="' + i + '">' +
               '<div class="moldura">' + moldura(p, false) + "</div>" +
               '<div class="corpo">' +
                 '<span class="chip ' + e.cls + '">' + e.txt + "</span>" +
                 '<span class="cod">' + esc(p.cod) + "</span>" +
                 '<span class="nome">' + esc(p.nome) + "</span>" +
                 (temPreco(p) ? '<span class="preco">' + dinheiro(p.preco) + "</span>" : "") +
               "</div>" +
             "</button>";
    }).join("");

    elGrade._lista = lista;
    ligarQuedaDeFoto(elGrade);
  }

  // ─────────── ficha da peça ───────────
  elGrade.addEventListener("click", function (e) {
    var b = e.target.closest(".peca"); if (!b) return;
    abrirFicha(elGrade._lista[parseInt(b.dataset.i, 10)]);
  });

  function abrirFicha(p) {
    if (!p) return;
    var e = estado(p.qtd);
    var attrs = [
      ["Teor",     p.teor],
      ["Peso",     p.peso ? p.peso.replace(".", ",") + " g" : ""],
      ["Tamanho",  p.tam],
      ["Categoria",p.cat],
      ["Coleção",  p.colecao],
      ["Fornecedor", p.forn]
    ].filter(function (a) { return a[1] && a[1] !== "—"; });

    dlgCaixa.innerHTML =
      '<div class="puxador"></div>' +
      '<div class="ficha-foto">' + moldura(p, true) + "</div>" +
      '<div class="ficha-cod">' + esc(p.cod) + "</div>" +
      '<div class="ficha-nome">' + esc(p.nome) + "</div>" +
      '<span class="chip ' + e.cls + '" style="font-size:13px;padding:5px 11px">' + e.txt + "</span>" +
      (temPreco(p) ? '<div class="ficha-preco">' + dinheiro(p.preco) + "</div>" : "") +
      '<ul class="atributos">' + attrs.map(function (a) {
        return "<li><span class=\"rot\">" + esc(a[0]) + '</span><span class="val">' + esc(a[1]) + "</span></li>";
      }).join("") + "</ul>" +
      '<div class="acoes">' +
        '<button class="btn" type="button" data-fechar>Voltar</button>' +
        '<button class="btn primario" type="button" data-copiar>Copiar referência</button>' +
      "</div>";

    ligarQuedaDeFoto(dlgCaixa);
    dlgCaixa.querySelector("[data-fechar]").addEventListener("click", function () { dlg.close(); });
    dlgCaixa.querySelector("[data-copiar]").addEventListener("click", function () {
      var botao = this, txt = p.cod + " — " + p.nome;
      function ok() { botao.textContent = "Copiado ✓"; botao.classList.add("feito");
                      setTimeout(function () { botao.textContent = "Copiar referência"; botao.classList.remove("feito"); }, 1800); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(ok, function () { seleciona(txt, ok); });
      } else seleciona(txt, ok);
    });
    dlg.showModal();
  }

  function seleciona(txt, ok) {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch (err) { /* sem área de transferência */ }
    document.body.removeChild(ta);
  }

  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

  // ─────────── partida ───────────
  montarDemo(); montarFiltros(); desenhar();
  carregar();
  setInterval(carregar, RECARGA_MS);
  setInterval(desenhar, 60000);   // mantém o carimbo envelhecendo mesmo sem rede
})();
</script>
